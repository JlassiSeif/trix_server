<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 79 123" width="79" height="123">
  <!-- Dineri's card back (docs/game-look.md): burgundy, the eight-point star pattern, a brass
       medallion. Colours are the brand's tokens (brand/tokens.css): back, brass-hi. -->
  <defs>
    <pattern id="stars" width="11" height="11" patternUnits="userSpaceOnUse" x="0.5" y="0.5">
      <g fill="none" stroke="#e6c46f" stroke-opacity=".45" stroke-width=".6">
        <rect x="3" y="3" width="5" height="5"/>
        <rect x="3" y="3" width="5" height="5" transform="rotate(45 5.5 5.5)"/>
      </g>
    </pattern>
    <clipPath id="inner"><rect x="4" y="4" width="71" height="115" rx="3"/></clipPath>
  </defs>
  <rect width="79" height="123" rx="5" fill="#f3ead8"/>
  <rect x="2" y="2" width="75" height="119" rx="4" fill="#7a1f26"/>
  <g clip-path="url(#inner)"><rect x="4" y="4" width="71" height="115" fill="url(#stars)"/></g>
  <rect x="4" y="4" width="71" height="115" rx="3" fill="none" stroke="#e6c46f" stroke-opacity=".85" stroke-width=".8"/>
  <circle cx="39.5" cy="61.5" r="17" fill="#7a1f26"/>
  <circle cx="39.5" cy="61.5" r="15" fill="none" stroke="#e6c46f" stroke-width="1.2"/>
  <circle cx="39.5" cy="61.5" r="17.2" fill="none" stroke="#e6c46f" stroke-opacity=".5" stroke-width=".6"/>
  <g fill="#e6c46f">
    <rect x="32.5" y="54.5" width="14" height="14"/>
    <rect x="32.5" y="54.5" width="14" height="14" transform="rotate(45 39.5 61.5)"/>
  </g>
  <circle cx="39.5" cy="61.5" r="3.4" fill="#7a1f26"/>
</svg>
